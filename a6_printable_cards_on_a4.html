<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A6 Printable Cards with Font Controls</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Print specific styles to enforce A4 landscape and remove margins */
        @page {
            size: A4 landscape;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6; /* gray-100 */
            font-family: 'Inter', sans-serif, Arial;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The main A4 container */
        .page {
            width: 297mm;
            height: 210mm;
            background: white;
            margin: 20px 0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            page-break-after: always;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Individual A6 card (Quadrant) wrapper */
        .card-wrapper {
            position: relative;
            box-sizing: border-box;
            border-right: 1px dashed #9ca3af;
            border-bottom: 1px dashed #9ca3af;
            display: flex;
            flex-direction: column;
        }

        /* Clean up outer borders */
        .card-wrapper:nth-child(2n) { border-right: none; }
        .card-wrapper:nth-child(3), .card-wrapper:nth-child(4) { border-bottom: none; }

        /* Editable text area */
        .card-content {
            flex-grow: 1;
            padding: 15mm; 
            outline: none;
            overflow-y: auto;
            /* Default font size set via inline style in JS, but fallback here */
            font-size: 10.5pt; 
        }

        .card-content:empty:before {
            content: "Click to add text...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }

        /* Print visibility controls */
        @media print {
            body {
                background: none;
                margin: 0;
            }
            .page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }
            .no-print {
                display: none !important;
            }
            html, body {
                width: 297mm;
                height: 210mm;
            }
            /* Ensure content doesn't scroll in print */
            .card-content {
                overflow: hidden;
            }
        }
    </style>
</head>
<body>

    <!-- Global Controls (Hidden on Print) -->
    <div class="controls no-print fixed top-0 left-0 w-full bg-slate-800 text-white p-4 shadow-lg z-50 flex justify-center gap-6">
        <button id="add-page-btn" class="bg-blue-600 hover:bg-blue-500 transition-colors px-6 py-2 rounded font-medium shadow flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
            </svg>
            Add Page (4 Cards)
        </button>
        <button id="remove-pages-btn" class="bg-red-600 hover:bg-red-500 transition-colors px-6 py-2 rounded font-medium shadow flex items-center gap-2 hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            Remove Extra Pages
        </button>
        <button id="print-btn" class="bg-emerald-600 hover:bg-emerald-500 transition-colors px-6 py-2 rounded font-medium shadow flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd"></path>
            </svg>
            Print
        </button>
    </div>

    <!-- Spacer to offset the fixed header on screen -->
    <div class="no-print h-20 w-full"></div>

    <!-- Container for dynamic pages -->
    <div id="document-container" class="flex flex-col items-center w-full">
        <!-- Pages injected here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('document-container');
            const addPageBtn = document.getElementById('add-page-btn');
            const removePagesBtn = document.getElementById('remove-pages-btn');
            const printBtn = document.getElementById('print-btn');

            /**
             * Creates a new A4 page element containing 4 A6 quadrants with font controls.
             */
            function createPage() {
                const page = document.createElement('div');
                page.className = 'page';
                
                let quadrantsHTML = '';
                // Create 4 quadrants using template literals for cleaner structure
                for (let i = 0; i < 4; i++) {
                    quadrantsHTML += `
                        <div class="card-wrapper group">
                            <div class="img-container flex-shrink-0 flex justify-center items-center w-full hidden p-4 box-border relative" style="max-height: 50%;">
                                <img class="card-img max-w-full max-h-full object-contain rounded-md shadow-sm border border-gray-200" src="">
                            </div>
                            <div class="card-content" contenteditable="true" style="font-size: 10.5pt;">
                                <div style="font-weight: bold; margin-bottom: 8px;">Card Title</div>
                                <div>Start typing your content here...</div>
                            </div>
                            <div class="no-print absolute bottom-4 right-4 flex items-center gap-2 bg-white/90 shadow-md border border-gray-200 p-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm">
                                <button class="btn-decrease w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-700 rounded text-lg font-bold transition-colors" title="Decrease Font Size">-</button>
                                <span class="font-size-label text-xs font-semibold text-gray-600 w-12 text-center pointer-events-none">10.5pt</span>
                                <button class="btn-increase w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-700 rounded text-lg font-bold transition-colors" title="Increase Font Size">+</button>
                                <input type="file" accept="image/*" class="file-input hidden">
                                <button class="btn-add-img w-8 h-8 flex items-center justify-center bg-blue-50 hover:bg-blue-100 text-blue-600 rounded text-base font-bold transition-colors ml-3 shadow-sm border border-blue-200" title="Add Image">🖼️</button>
                                <button class="btn-rm-img w-8 h-8 flex items-center justify-center bg-red-50 hover:bg-red-100 text-red-600 rounded text-base font-bold transition-colors hidden ml-3 shadow-sm border border-red-200" title="Remove Image">🗑️</button>
                            </div>
                        </div>
                    `;
                }
                
                page.innerHTML = quadrantsHTML;
                container.appendChild(page);
                
                // Scroll to the new page if it's not the first one
                if (container.children.length > 1) {
                    removePagesBtn.classList.remove('hidden');
                    page.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
            }

            // --- Event Delegation for Dynamic and Statically created cards ---
            // Handles all button clicks within the document container
            container.addEventListener('click', (e) => {
                const wrapper = e.target.closest('.card-wrapper');
                if (!wrapper) return; // Ignore clicks outside a card

                const content = wrapper.querySelector('.card-content');
                const label = wrapper.querySelector('.font-size-label');
                const fileInput = wrapper.querySelector('.file-input');
                const imgContainer = wrapper.querySelector('.img-container');
                const img = wrapper.querySelector('.card-img');
                const btnAddImg = wrapper.querySelector('.btn-add-img');
                const btnRmImg = wrapper.querySelector('.btn-rm-img');

                if (e.target.closest('.btn-decrease')) {
                    let currentSize = parseFloat(content.style.fontSize) || 10.5;
                    let newSize = Math.max(5, currentSize - 0.5);
                    content.style.fontSize = `${newSize.toFixed(1)}pt`;
                    label.innerText = `${Number(newSize.toFixed(1))}pt`;
                } else if (e.target.closest('.btn-increase')) {
                    let currentSize = parseFloat(content.style.fontSize) || 10.5;
                    let newSize = Math.min(72, currentSize + 0.5);
                    content.style.fontSize = `${newSize.toFixed(1)}pt`;
                    label.innerText = `${Number(newSize.toFixed(1))}pt`;
                } else if (e.target.closest('.btn-add-img')) {
                    fileInput.click();
                } else if (e.target.closest('.btn-rm-img')) {
                    img.src = '';
                    imgContainer.classList.add('hidden');
                    fileInput.value = ''; // Reset input so same file can be chosen again
                    btnAddImg.classList.remove('hidden');
                    btnRmImg.classList.add('hidden');
                }
            });

            // Handles file input changes (image upload) within the document container
            container.addEventListener('change', (e) => {
                if (e.target.matches('.file-input')) {
                    const wrapper = e.target.closest('.card-wrapper');
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = wrapper.querySelector('.card-img');
                            const imgContainer = wrapper.querySelector('.img-container');
                            const btnAddImg = wrapper.querySelector('.btn-add-img');
                            const btnRmImg = wrapper.querySelector('.btn-rm-img');
                            
                            img.src = event.target.result;
                            imgContainer.classList.remove('hidden');
                            btnAddImg.classList.add('hidden');
                            btnRmImg.classList.remove('hidden');
                        };
                        reader.readAsDataURL(file);
                    }
                }
            });

            // Global Event Listeners
            addPageBtn.addEventListener('click', createPage);
            
            removePagesBtn.addEventListener('click', () => {
                // Remove all child elements (pages) except the first one
                while (container.children.length > 1) {
                    container.removeChild(container.lastChild);
                }
                removePagesBtn.classList.add('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            
            printBtn.addEventListener('click', () => {
                window.print();
            });

            // Initialize document with the first page
            createPage();
        });
    </script>
</body>
</html>
