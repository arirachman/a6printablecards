<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A6 Printable Cards (A4 Landscape)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 
         * Print specific styles
         * Ensures A4 landscape formatting and removes browser margins.
         */
        @page {
            size: A4 landscape;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #e5e7eb; /* gray-200 for screen background */
            font-family: 'Inter', sans-serif, Arial;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 
         * Page container simulating A4 paper 
         */
        .page {
            width: 297mm;
            height: 210mm;
            background: white;
            margin: 20px 0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            page-break-after: always;
            box-sizing: border-box;
            /* Prevents bleeding outside the page */
            overflow: hidden; 
        }

        /* 
         * Individual A6 card (Quadrant)
         */
        .card {
            box-sizing: border-box;
            font-size: 10.5pt;
            padding: 15mm; /* Safe padding for text inside */
            outline: none; /* Removes focus outline when editing */
            position: relative;
            /* Dashed borders for cutting. */
            border-right: 1px dashed #6b7280;
            border-bottom: 1px dashed #6b7280;
            display: flex;
            flex-direction: column;
        }

        /* Remove double borders on the outer edges and bottom/right */
        .card:nth-child(2n) {
            border-right: none;
        }
        .card:nth-child(3), .card:nth-child(4) {
            border-bottom: none;
        }

        /* Editable text area behavior */
        .card[contenteditable="true"]:empty:before {
            content: "Click to add text (10.5pt)...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }

        /* 
         * Hide controls and background elements during printing
         */
        @media print {
            body {
                background: none;
                margin: 0;
            }
            .page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }
            .no-print {
                display: none !important;
            }
            /* Force exact dimensions during print to override any scaling */
            html, body {
                width: 297mm;
                height: 210mm;
            }
        }
    </style>
</head>
<body>

    <!-- Control Panel (Hidden on Print) -->
    <div class="controls no-print fixed top-0 left-0 w-full bg-slate-800 text-white p-4 shadow-lg z-50 flex justify-center gap-6">
        <button id="add-page-btn" class="bg-blue-600 hover:bg-blue-500 transition-colors px-6 py-2 rounded font-medium shadow flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Add Page (4 Cards)
        </button>
        <button id="print-btn" class="bg-emerald-600 hover:bg-emerald-500 transition-colors px-6 py-2 rounded font-medium shadow flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" />
            </svg>
            Print
        </button>
    </div>

    <!-- Spacer to offset the fixed header on screen -->
    <div class="no-print h-20 w-full"></div>

    <!-- Container for dynamic pages -->
    <div id="document-container" class="flex flex-col items-center w-full">
        <!-- Pages will be injected here via JavaScript -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('document-container');
            const addPageBtn = document.getElementById('add-page-btn');
            const printBtn = document.getElementById('print-btn');

            /**
             * Creates a new A4 page element containing 4 A6 quadrants.
             */
            function createPage() {
                const page = document.createElement('div');
                page.className = 'page';
                
                // Create 4 quadrants (A6 cards)
                for (let i = 0; i < 4; i++) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.contentEditable = true; // Make text editable
                    
                    // Add some default placeholder structure
                    card.innerHTML = `
                        <div style="font-weight: bold; margin-bottom: 8px;">Card Title</div>
                        <div>Start typing your 10.5pt content here...</div>
                    `;
                    
                    page.appendChild(card);
                }
                
                container.appendChild(page);
                
                // Smoothly scroll to the new page if it's not the first one
                if (container.children.length > 1) {
                    page.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
            }

            // Event Listeners
            addPageBtn.addEventListener('click', createPage);
            
            printBtn.addEventListener('click', () => {
                window.print();
            });

            // Initialize the document with the first page
            createPage();
        });
    </script>
</body>
</html>
